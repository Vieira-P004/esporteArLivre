<main id="container">
    <div id="divForm">
        <h2>Cadastro Atleta</h2>

        <form id="formAtleta" (submit)="salvarAtleta()">

            <div class="formGroup">
                <label for="nome">Nome</label>
                <input type="text" name="nome" [(ngModel)] ="nome" id="nome" class="input01" maxlength="80" placeholder="Informe seu nome">

                <label for="data_nascimento">Data de Nascimento</label>
                <input type="date" name="data_nascimento" id="data_nascimento" [(ngModel)] ="data_nascimento" class="input01">
            </div>

            <div class="formRow">

                <div class="formGroup">
                    <label for="cpf">CPF</label>
                    <input type="text" name="cpf" id="cpf" [(ngModel)]="cpf" class="input02" maxlength="80" placeholder="Informe seu cpf">
                </div>
                <div class="formGroup">
                    <label for="sexo">Sexo</label>
                    <select name="sexo" id="sexo" [(ngModel)]="sexo">
                        <option value="sexoM">Maculino</option>
                        <option value="sexoF">Feminino</option>
                        <option value="sexoN">Não quero informar</option>   
                    </select>
                </div>
            </div>

            <div class="formRow">
                <div class="formGroup">
                    <label for="cep">CEP</label>
                    <input type="text" name="cep" [(ngModel)]="cep" id="cep" class="input02" maxlength="9" placeholder="Informe seu cep">
                </div>
                <div class="formGroup">
                    <label for="rua_logradouro">Logradouro</label>
                    <input type="text" name="rua_logradouro" [(ngModel)]="ruaLogradouro" id="rua_logradouro" class="input01" maxlength="100" placeholder="Informe seu logradouro">
                </div>
            </div>

            <div class="formRowTres">
                <div class="formGroup">
                    <label for="bairro">Bairro</label>
                    <input type="text" name="bairro" [(ngModel)]="bairro" id="bairro" class="input02" maxlength="20" placeholder="Informe seu bairro">
                </div>
                <div class="formGroup">
                    <label for="cidade">Cidade</label>
                    <input type="text" name="cidade" [(ngModel)]="cidade" id="cidade" class="input02" maxlength="60" placeholder="Informe seu cidade">
                </div>
                <div class="formGroup">
                    <label for="uf">UF</label>
                    <input type="text" name="uf" 
                    [(ngModel)]="uf" id="uf" class="input02" required maxlength="2" placeholder="Informe seu estado">

                </div>
            </div>

            <div id="divBtn">
                <button type="submit" id="btnAdd">Cadastrar Atleta</button>
                <button type="reset" id="btnLimpar">Limpar Dados</button>
            </div>
            
        </form>
    </div>
</main>
