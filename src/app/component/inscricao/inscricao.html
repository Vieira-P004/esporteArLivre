<div id="divForm">
    <h2>Inscrição</h2>
    <form id="formInscricao" (submit)="formInscricao()">
        
        <div class="formRow">
            <div class="formGroup">
                <label for="atletaCadastrado">Atleta Cadastrado</label>
                <select
                name="atletaCadastrado" 
                id="atletaCadastrado" 
                [(ngModel)]="atletaCadastrado" 
                (ngModelChange)="preencherCpf($event)">

                <option value="" disabled selected>Selecione o Atleta
                </option>

                @for (atleta of atletas; track $index) {
                <option  [value]="atleta.id" > {{atleta.nome}}  </option>
                }
                </select>
            </div>
            
            <div class="formGroup">
                <label for="buscarCpf">Buscar por CPF</label>
                <input type="text" name="buscarCpf" id="buscarCpf" [(ngModel)]="buscarCpf"  maxlength="11" (input)="buscarAtletaPorCpf()" placeholder="Digite o CPF">
            </div>
        </div>
        
        <div class="formRow">
            <div class="formGroup">
                <label for="corridaEscolhida">Corrida Escolhida</label>
                <select name="corridaEscolhida" id="corridaEscolhida" [(ngModel)]="corridaEscolhida" >
                    <option value="" disabled selected>Selecione</option>

                    @for (corrida of corridas; track $index){
                    <option [value]="corrida.id">{{corrida.descricao_corrida}}</option>
                    }
                </select>
            </div>
    
            <div>
                <label for="distaciaDisponiveis">Distância Disponíveis </label>
                <input type="radio" id="distancia5km" name="distancia5km" value="5km" [(ngModel)]="distanciaSelecionada" >5km
                <input type="radio" id="distancia10km" name="distancia10km" value="10km" [(ngModel)]="distanciaSelecionada" > 10km
                <input type="radio" id="distancia25km" name="distancia25km" value="25km" [(ngModel)]="distanciaSelecionada" > 25km
            </div>

        </div>
        
        <div class="formOther">
            <div class="formGroup">
                <label for="kit">Tamanho da camiseta (kit)</label>
                <select name="kit" id="kit" >
                    <option  value="p" >P</option>
                    <option  value="m" >M</option>
                    <option  value="g" >G</option>
                    <option  value="gg" >GG</option>
                </select>
    
            </div>
            <div class="formGroup">
                <label for="categoriaIdade">Categoria</label>
                <input type="text" name="categoriaIdade" id="categoriaIdade" [(ngModel)]="categoriaIdade" placeholder="Geral Masc / 30-39">
    
            </div>
        </div>

        <div id="valorInscricao">
            <h2>Valor da inscrição:</h2>
            <h2 id="numero">89,90</h2>
        </div>

        <div id="regulamento">
            <input name="regulamento" type="checkbox"> Li e aceito os termos de regulamento da prova e declaração de saúde.
        </div>

        <div id="divBtn">
            <button type="submit">Finalizar e ir para pagamento</button>
        </div>
    </form>
</div>
