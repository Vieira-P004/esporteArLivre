<div id="div-lista">
    <h2>Lista Corrida</h2>

    <div id="listaCorrida">
        
            @for(elem of listarCorridas(); track elem.id){
                <div class="itemCorrida"> 
                    <span class="dadosForm">
                        <span class="dadosCorrida" >
                            {{elem.descricao_corrida}} - {{elem.data_corrida}} - Distâncias: {{elem.distancia_5km ? '5km':''}} 
                            {{elem.distancia_10km ? ' 10km':''}}
                            {{elem.distancia_25km ? ' 25KM' :''}}
                        </span>
                        <span class="linksLista">
                            <a class="linkEditar" (click)="carregarDadosForm(elem)">Editar</a>
                            <a class="linkExcluir" (click)="excluir(elem)" >Excluir</a>
                        </span>
                    </span>
                </div>
            }@empty{
                <div class="divSemRegistro">
                    NENHUM REGISTRO NA LISTA
                </div>
            }

    </div>
</div>
