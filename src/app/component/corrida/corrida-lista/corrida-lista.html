<div id="div-lista">
    <h2>Lista Corrida</h2>

    <div id="listaCorrida">
        

            @for(elem of listarCorridas(); track elem.id){
                <div class="itemCorrida"> 
                    <span class="dadosForm">
                        <span class="dadosCorrida" >
                            {{elem.descricao_corrida}} - {{elem.data_corrida}} - Distâncias: {{elem.distancia5km ? '5km':''}} 
                            {{elem.distancia10km ? ' 10km':''}}
                            {{elem.distancia25km ? ' 25KM' :''}}
                        </span>
                        <span class="linksLista">
                            <a class="linkEditar">Editar</a>
                            <a class="linkExcluir">Excluir</a>
                        </span>
                    </span>
                </div>
            }@empty{
                <div class="divItemCorrida">
                    NENHUM REGISTRO NA LISTA
                </div>
            }

        
    </div>
</div>
