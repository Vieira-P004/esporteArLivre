<div id="divForm">
    <h2>Cadastro de Corrida</h2>
    <form id="formCorrida" (submit)="dadosFormulario()">
        <label for="descricao_corrida">Descrição da Corrida</label>
        <textarea name="descricao_corrida" [(ngModel)]="descricao_corrida" id="descricao_corrida" cols="30" rows="10" placeholder="Ex: 5ª Night Race"></textarea>

        <label for="data_corrida">Data da Corrida</label>
        <input type="date"  name="data_corrida" [(ngModel)]="data_corrida" id="data_corrida">

        <label for="distaciaDisponiveis">Distância Disponíveis </label>
        <input type="checkbox" name="distancia_5km" id="distancia_5km" [(ngModel)]="distancia_5km" > 5km
        <input type="checkbox" name="distancia_10km" id="distancia_10km" [(ngModel)]="distancia_10km" > 10km
        <input type="checkbox" name="distancia_25km" id="distancia_25km" [(ngModel)]="distancia_25km" > 25km


        <div id="divBtn">
            <button type="submit" id="btnAdd" >{{editar? 'Alterar': 'Cadastrar'}} Corrida </button>
        </div>
    </form>
</div>
