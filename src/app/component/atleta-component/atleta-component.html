<div id="divForm">
    <form id="formAtleta">
        <label for="nome">Nome</label>
        <input type="text" name="nome" id="nome" class="input01" maxlength="80" placeholder="Informe seu nome">

        <label for="cpf">CPF</label>
        <input type="text" name="cpf" id="cpf" class="input02" maxlength="80" placeholder="Informe seu cpf">

        <label for="sexo">Sexo</label>
        <input type="radio" name="sexo" id="sexoM" class="btnSelecao" value="M">Masculino
        <input type="radio" name="sexo" id="sexoF" class="btnSelecao" value="F">Feminino
        <input type="radio" name="sexo" id="sexoN" class="btnSelecao" value="N">Não quero informar

        <label for="cep">CEP</label>
        <input type="text" name="cep" id="cep" class="input02" maxlength="9" placeholder="Informe seu cep">

        <label for="ruaLogradouro">Nome</label>
        <input type="text" name="ruaLogradouro" id="ruaLogradouro" class="input01" maxlength="100" placeholder="Informe seu logradouro">

        <label for="bairro">Nome</label>
        <input type="text" name="bairro" id="bairro" class="input02" maxlength="20" placeholder="Informe seu bairro">

        <label for="cidade">Nome</label>
        <input type="text" name="cidade" id="cidade" class="input02" maxlength="60" placeholder="Informe seu cidade">

        <label for="uf">UF</label>
        <input type="text" name="uf" id="uf" class="input02" required maxlength="2" placeholder="Informe seu UF">

        <div id="divBtn">
            <button type="submit" id="btnAdd">Cadastrar Atleta</button>
            <button type="reset" id="btnLimpar">Cadastrar Atleta</button>
        </div>
    </form>
</div>
